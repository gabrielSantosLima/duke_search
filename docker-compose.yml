services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            - DATABASE_HOST=dukedb
        ports:
            - ${PORT:-3333}:3333
        depends_on:
            dukedb:
                condition: service_healthy
    web:
        build:
            context: ./web
            dockerfile: Dockerfile
            args:
                - VITE_API_URL=${VITE_API_URL:-http://localhost:3333}
        ports:
            - ${WEB_PORT:-3000}:80
        depends_on:
            - api
    dukedb:
        image: pgvector/pgvector:pg18-trixie
        restart: always
        shm_size: 128mb
        env_file:
            - .env
        environment:
            - POSTGRES_DB=${DATABASE_DB}
            - POSTGRES_USER=${DATABASE_USER}
            - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
        volumes:
            - ./db:/docker-entrypoint-initdb.d
        ports:
            - ${DATABASE_PORT}:5432
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
    adminer:
        image: adminer
        restart: always
        ports:
            - 8080:8080
